[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sangram-ai-backend"
version = "1.0.0"
description = "Sangram AI Backend - Dialectic Multi-Model Arena Platform"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Developer 1 - Backend Architecture", email = "dev1@sangram.ai" }
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
    "pyjwt>=2.8.0",
    "argon2-cffi>=23.1.0",
    "email-validator>=2.1.0",
    "aiosmtplib>=3.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "aiosqlite>=0.20.0",
    "ruff>=0.5.0"
]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [".venv", "alembic/versions"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# conftest inserts the backend root on sys.path before importing the app.
"tests/conftest.py" = ["E402"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
filterwarnings = [
    "ignore::DeprecationWarning"
]
