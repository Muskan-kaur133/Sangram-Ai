services:
  postgres:
    image: postgres:16-alpine
    container_name: sangram-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sangram_ai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sangram_ai"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sangram-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: development
      DEBUG: "false"
      HOST: 0.0.0.0
      PORT: 8000
      SECRET_KEY: "dev-insecure-secret-key-change-in-production-min32chars!"
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/sangram_ai
      ALLOWED_ORIGINS: '["http://localhost:3000","http://127.0.0.1:3000"]'
      LOG_LEVEL: INFO
      LOG_JSON: "true"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
